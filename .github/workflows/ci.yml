name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal token permissions: quality gates only need read access.
# (upload-artifact uses the runner's implicit artifact credential.)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: '0'

jobs:
  quality:
    name: Format / Lint / Typecheck / Unit / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (pinned)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned)
        with:
          node-version: '22.23.2'
          cache: pnpm
      # Frozen lockfile: CI never silently mutates dependencies.
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:contracts
      - run: pnpm build

  integration:
    name: Integration (Docker containers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (pinned)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned)
        with:
          node-version: '22.23.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testcontainers drives Postgres/Valkey directly on the runner's Docker.
      - run: pnpm test:integration
      # SAF real/privacy specs intentionally require an externally supplied
      # migrated database; this runner owns and cleans that isolated database.
      - run: pnpm test:saf:real

  e2e:
    name: E2E (Playwright + compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (pinned)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned)
        with:
          node-version: '22.23.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start infrastructure
        run: docker compose up -d --wait
      - name: Install Playwright browser
        run: pnpm --filter @wai/web exec playwright install --with-deps chromium
      - name: Run E2E smoke (starts API + Web via playwright webServer)
        run: pnpm test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (pinned)
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: Stop infrastructure
        if: always()
        run: docker compose down

  real-uat:
    name: Real two-member UAT (desktop / mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (pinned)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned)
        with:
          node-version: '22.23.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wai/web exec playwright install --with-deps chromium
      - name: Real API / DB / queue journeys
        run: pnpm exec tsx apps/web/e2e/run-globalization-real.ts
      - name: Real onboarding journey
        run: pnpm exec tsx apps/web/e2e/run-onboarding-real.ts
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (pinned)
        with:
          name: real-uat-evidence
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  staging-package:
    name: Production images / migrations / health / encrypted backup
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (pinned)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned)
        with:
          node-version: '22.23.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm staging:test
      - run: pnpm staging:env
      - run: pnpm staging:preflight
      - name: Validate rendered Compose contract
        run: docker compose --env-file deploy/staging.env -f deploy/compose.staging.yaml config --quiet
      - name: Build and start production-process stack
        run: pnpm staging:deploy
      - run: pnpm staging:smoke
      - name: Create encrypted recovery artifact
        run: pnpm staging:backup -- --output=ci-acceptance.dump.enc
      - name: Stop isolated staging resources
        if: always()
        run: docker compose --env-file deploy/staging.env -f deploy/compose.staging.yaml -p wai-staging down -v --remove-orphans

  security:
    name: Audit / Secrets / SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)
        with:
          fetch-depth: 0 # full history so the secret scan sees every commit
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (pinned)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned)
        with:
          node-version: '22.23.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Explicit failure policy: the build FAILS on any high-or-critical
      # vulnerability in production dependencies (low/moderate are recorded
      # in the log but do not block). Dev-only tooling is out of scope.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
      # Explicit failure policy: the build FAILS on any detected secret or
      # high-entropy string in the full git history or the working tree.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3 (pinned)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Explicit failure policy: the build FAILS if the SBOM cannot be
      # generated from the lockfile (inventory must stay complete).
      - name: Generate SBOM (cdxgen)
        uses: CycloneDX/cdxgen-action@5668048b6479c5ee557eec3e1766132a4661681f # v1 (pinned)
        with:
          output: './sbom.json'
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (pinned)
        with:
          name: sbom
          path: sbom.json
          retention-days: 30
